# ---------------------------------------------------------------
# Library Book Management System - backend configuration
# Locally it uses MySQL: EDIT the defaults after ":" below (or set the env vars).
# In the cloud (Render + Supabase Postgres) the env vars are set on the host:
#   DATABASE_URL=jdbc:postgresql://<host>:5432/postgres?sslmode=require
#   DATABASE_USERNAME, DATABASE_PASSWORD, CORS_ALLOWED_ORIGINS
# ---------------------------------------------------------------
spring.application.name=library-book-management

# 1) Database URL (the JDBC driver is picked from the URL: mysql or postgresql)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/library_book_management?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# 2) Database username
spring.datasource.username=${DATABASE_USERNAME:root}
# 3) Database password  <-- replace YOUR_MYSQL_PASSWORD with your own password
spring.datasource.password=${DATABASE_PASSWORD:YOUR_MYSQL_PASSWORD}

# Small connection pool so the free Supabase pooler and 512 MB Render instance are not exhausted
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.keepalive-time=60000

# Hibernate creates/updates the TABLES automatically (the database itself must exist).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Hosting platforms such as Render pass the port in $PORT; 8080 locally
server.port=${PORT:8080}

# Allowed frontend origins for CORS (comma separated, "*" wildcards allowed,
# e.g. https://library-book-management*.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
